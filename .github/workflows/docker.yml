name: Build and Push Docker Image

on:
    workflow_run:
        workflows: ['Release']
        types:
            - completed
    push:
        branches:
            - dev
    workflow_dispatch:
        inputs:
            target:
                description: 'Deployment target (prod or dev)'
                required: false
                default: 'prod'
                type: choice
                options:
                    - prod
                    - dev

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
        runs-on: ubuntu-latest
        steps:
            - name: 📥 Checkout
              uses: actions/checkout@v4
              with:
                  lfs: true
                  fetch-depth: 0
                  ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}

            - name: 🏷️ Detect Target and Release Tag
              id: check
              run: |
                  # Check if dev build
                  if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "dev" ]; then
                    echo "🔧 Detected dev branch push. Building dev image."
                    echo "is_dev=true" >> $GITHUB_OUTPUT
                    echo "is_release=false" >> $GITHUB_OUTPUT
                    echo "should_build=true" >> $GITHUB_OUTPUT
                  elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.target }}" = "dev" ]; then
                    echo "🔧 Manual dispatch for dev target."
                    echo "is_dev=true" >> $GITHUB_OUTPUT
                    echo "is_release=false" >> $GITHUB_OUTPUT
                    echo "should_build=true" >> $GITHUB_OUTPUT
                  else
                    # Check if the current commit is tagged
                    if TAG=$(git describe --tags --exact-match 2>/dev/null); then
                      echo "Found release tag: $TAG"
                      echo "TAG=$TAG" >> $GITHUB_ENV
                      
                      # Parse semver parts (assuming vX.Y.Z format)
                      VERSION=${TAG#v}
                      echo "VERSION=$VERSION" >> $GITHUB_ENV
                      
                      MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
                      echo "MAJOR_MINOR=$MAJOR_MINOR" >> $GITHUB_ENV
                      
                      echo "is_release=true" >> $GITHUB_OUTPUT
                      echo "is_dev=false" >> $GITHUB_OUTPUT
                      echo "should_build=true" >> $GITHUB_OUTPUT
                    elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                      LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "latest")
                      echo "Manual prod dispatch with tag: $LATEST_TAG"
                      echo "TAG=$LATEST_TAG" >> $GITHUB_ENV
                      VERSION=${LATEST_TAG#v}
                      echo "VERSION=$VERSION" >> $GITHUB_ENV
                      MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
                      echo "MAJOR_MINOR=$MAJOR_MINOR" >> $GITHUB_ENV
                      echo "is_release=true" >> $GITHUB_OUTPUT
                      echo "is_dev=false" >> $GITHUB_OUTPUT
                      echo "should_build=true" >> $GITHUB_OUTPUT
                    else
                      echo "No tag found on HEAD. Skipping release build."
                      echo "is_release=false" >> $GITHUB_OUTPUT
                      echo "is_dev=false" >> $GITHUB_OUTPUT
                      echo "should_build=false" >> $GITHUB_OUTPUT
                    fi
                  fi

            - name: 📦 Install pnpm
              if: steps.check.outputs.should_build == 'true'
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: 🟢 Use Node.js 22
              if: steps.check.outputs.should_build == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: 🧩 Install dependencies
              if: steps.check.outputs.should_build == 'true'
              run: pnpm install --frozen-lockfile

            - name: 💾 Restore Image Cache
              if: steps.check.outputs.should_build == 'true'
              id: image-cache
              uses: actions/cache@v4
              with:
                  path: |
                      .next/cache
                      .image-cache
                      public/media/images/next-image-export-optimizer-hashes.json
                  key: ${{ runner.os }}-next-images-${{ hashFiles('public/media/images/**/*', 'next.config.mjs') }}
                  restore-keys: |
                      ${{ runner.os }}-next-images-

            - name: 🏗️ Build & Optimize
              if: steps.check.outputs.should_build == 'true'
              env:
                  NEXT_TELEMETRY_DISABLED: 1
                  INTERNAL_ICS_TOKEN: ${{ secrets.INTERNAL_ICS_TOKEN }}
                  nextImageExportOptimizer_imageFolderPath: 'public/media/images'
                  nextImageExportOptimizer_exportFolderPath: 'out'
                  nextImageExportOptimizer_exportFolderName: 'nextImageExportOptimizer'
                  nextImageExportOptimizer_quality: '60'
                  nextImageExportOptimizer_storePicturesInWEBP: 'true'
                  nextImageExportOptimizer_generateAndUseBlurImages: 'true'
                  nextImageExportOptimizer_imageSizes: '16,64,128,256,384'
                  nextImageExportOptimizer_deviceSizes: '640,1080,1920'
              run: |
                  pnpm build
                  mkdir -p out/nextImageExportOptimizer
                  if [ -d ".image-cache" ]; then
                    echo "Restoring images from cache..."
                    cp -r .image-cache/* out/nextImageExportOptimizer/ || true
                  fi
                  pnpm next-image-export-optimizer
                  node scripts/inline-css.mjs
                  mkdir -p .image-cache
                  cp -r out/nextImageExportOptimizer/* .image-cache/

            - name: 🐳 Setup Docker Buildx
              if: steps.check.outputs.should_build == 'true'
              uses: docker/setup-buildx-action@v3

            - name: 🔐 Log in to GHCR
              if: steps.check.outputs.should_build == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 🔡 Lowercase Repo Name
              if: steps.check.outputs.should_build == 'true'
              run: echo "IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

            - name: 🏷️ Extract Metadata
              if: steps.check.outputs.should_build == 'true'
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=dev,enable=${{ steps.check.outputs.is_dev == 'true' }}
                      type=sha,prefix=dev-,enable=${{ steps.check.outputs.is_dev == 'true' }}
                      type=semver,pattern={{version}},enable=${{ steps.check.outputs.is_release == 'true' }}
                      type=semver,pattern={{major}}.{{minor}},enable=${{ steps.check.outputs.is_release == 'true' }}
                      type=raw,value=latest,enable=${{ steps.check.outputs.is_release == 'true' }}
                      type=raw,value=${{ env.TAG }},enable=${{ steps.check.outputs.is_release == 'true' }}
                      type=raw,value=${{ env.VERSION }},enable=${{ steps.check.outputs.is_release == 'true' }}
                      type=raw,value=${{ env.MAJOR_MINOR }},enable=${{ steps.check.outputs.is_release == 'true' }}

            - name: 🐳 Build and Push
              if: steps.check.outputs.should_build == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.static
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: 🚀 Trigger Dev VPS Deployment
              if: steps.check.outputs.is_dev == 'true'
              run: |
                  DEV_WEBHOOK="${{ secrets.WEBHOOK_DEV_URL }}"
                  if [ -z "$DEV_WEBHOOK" ]; then
                    DEV_WEBHOOK="${{ secrets.WEBHOOK_URL }}"
                  fi
                  curl -X POST \
                  -H "Content-Type: application/json" \
                  -d '{"ref": "dev"}' \
                  "${DEV_WEBHOOK}?token=${{ secrets.WEBHOOK_TOKEN }}"

            - name: 🚀 Trigger Production VPS Deployment
              if: steps.check.outputs.is_release == 'true'
              run: |
                  curl -X POST \
                  -H "Content-Type: application/json" \
                  -d '{"ref": "${{ github.ref_name }}"}' \
                  "${{ secrets.WEBHOOK_URL }}?token=${{ secrets.WEBHOOK_TOKEN }}"
